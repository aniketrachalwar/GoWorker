<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - GoWorker</title>
    <script src="/js/session-sync.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: var(--light-bg); min-height: 100vh;">

<header class="header" style="box-shadow: var(--shadow-sm); background: var(--white);">
  <div class="container nav-container" style="height: 70px; display: flex; align-items: center; justify-content: space-between;">
    <a href="/" class="logo">
      <img src="images/logo_icon.png" alt="GoWorker" style="height: 36px; margin-right: 8px;">
      <span>GoWorker</span>
    </a>
  </div>
</header>

<div class="container" style="margin-top: 5rem; margin-bottom: 5rem; min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 0 1rem; box-sizing: border-box;">
    <div class="card" style="max-width: 480px; width: 100%; padding: 40px; border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-premium); background: var(--white); box-sizing: border-box;">
        
        <div style="text-align: center; margin-bottom: 24px;">
            <i class="fa-solid fa-key" style="font-size: 40px; color: var(--success); margin-bottom: 12px;"></i>
            <h2 style="font-weight: 700; color: var(--dark-navy); margin-bottom: 4px;">Update Password</h2>
            <p style="color: var(--secondary-text); font-size: 14px; margin-bottom: 0;">Set a new secure password for your GoWorker account.</p>
        </div>

        <div id="error-alert" style="display: none; background: rgba(239, 68, 68, 0.08); border-left: 4px solid var(--danger); color: var(--danger); padding: 12px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; margin-bottom: 20px;">
            <i class="fa-solid fa-circle-exclamation"></i> <span id="error-message"></span>
        </div>

        <div id="success-alert" style="display: none; background: rgba(34, 197, 94, 0.08); border-left: 4px solid var(--success); color: var(--success); padding: 12px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; margin-bottom: 20px;">
            <i class="fa-solid fa-circle-check"></i> <span id="success-message"></span>
        </div>

        <form id="reset-form">
            <div style="margin-bottom: 20px; text-align: left;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--dark-navy);">New Password</label>
                <input type="password" id="new_password" required placeholder="New password" style="width: 100%; padding: 12px 16px; border: 1.5px solid var(--border-color); border-radius: 8px; font-size: 14px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 24px; text-align: left;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--dark-navy);">Confirm Password</label>
                <input type="password" id="confirm_password" required placeholder="Confirm password" style="width: 100%; padding: 12px 16px; border: 1.5px solid var(--border-color); border-radius: 8px; font-size: 14px; box-sizing: border-box;">
            </div>

            <button type="submit" id="submit-btn" class="btn-primary-auth" style="width: 100%; height: 50px;">
                <i class="fa-solid fa-check" style="margin-right: 6px;"></i> Update Password
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13px;">
            <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;"><i class="fa-solid fa-arrow-left"></i> Back to Log In</a>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';

    // Validate token on load
    if (!token || token.length !== 64) {
        document.getElementById("error-message").textContent = "Invalid or expired password reset token.";
        document.getElementById("error-alert").style.display = 'block';
        document.getElementById("reset-form").style.display = 'none';
    }

    document.getElementById("reset-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const new_password = document.getElementById("new_password").value;
        const confirm_password = document.getElementById("confirm_password").value;
        const errorAlert = document.getElementById("error-alert");
        const successAlert = document.getElementById("success-alert");
        const submitBtn = document.getElementById("submit-btn");

        errorAlert.style.display = 'none';
        successAlert.style.display = 'none';

        if (new_password !== confirm_password) {
            document.getElementById("error-message").textContent = "Passwords do not match!";
            errorAlert.style.display = 'block';
            return;
        }

        submitBtn.disabled = true;

        fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, new_password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                document.getElementById("success-message").textContent = data.message || "Password updated successfully!";
                successAlert.style.display = 'block';
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                submitBtn.disabled = false;
                document.getElementById("error-message").textContent = data.message || "Reset failed.";
                errorAlert.style.display = 'block';
            }
        })
        .catch(err => {
            submitBtn.disabled = false;
            document.getElementById("error-message").textContent = "An error occurred. Please try again.";
            errorAlert.style.display = 'block';
        });
    });
</script>

</body>
</html>
