<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - GoWorker</title>
    <script src="/js/session-sync.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: var(--light-bg); min-height: 100vh;">

<header class="header" style="box-shadow: var(--shadow-sm); background: var(--white);">
  <div class="container nav-container" style="height: 70px; display: flex; align-items: center; justify-content: space-between;">
    <a href="/" class="logo">
      <img src="images/logo_icon.png" alt="GoWorker" style="height: 36px; margin-right: 8px;">
      <span>GoWorker</span>
    </a>
  </div>
</header>

<div class="container" style="margin-top: 5rem; margin-bottom: 5rem; min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 0 1rem; box-sizing: border-box;">
    <div class="card" style="max-width: 480px; width: 100%; padding: 40px; border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-premium); background: var(--white); box-sizing: border-box;">
        
        <div style="text-align: center; margin-bottom: 24px;">
            <i class="fa-solid fa-lock" style="font-size: 40px; color: var(--primary); margin-bottom: 12px;"></i>
            <h2 style="font-weight: 700; color: var(--dark-navy); margin-bottom: 4px;">Forgot Password?</h2>
            <p style="color: var(--secondary-text); font-size: 14px; margin-bottom: 0;">Enter your registered email address and we'll generate a secure reset link.</p>
        </div>

        <div id="error-alert" style="display: none; background: rgba(239, 68, 68, 0.08); border-left: 4px solid var(--danger); color: var(--danger); padding: 12px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; margin-bottom: 20px;">
            <i class="fa-solid fa-circle-exclamation"></i> <span id="error-message"></span>
        </div>

        <div id="success-alert" style="display: none; background: rgba(34, 197, 94, 0.08); border-left: 4px solid var(--success); color: var(--success); padding: 12px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; margin-bottom: 20px;">
            <i class="fa-solid fa-circle-check"></i> <span id="success-message"></span>
        </div>
        
        <div id="reset-action-container" style="display: none; background: var(--light-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 8px; text-align: center; margin-bottom: 20px;">
            <p style="font-size: 13px; font-weight: 600; margin-bottom: 12px; color: var(--dark-navy);">Click the button below to update password:</p>
            <a id="reset-btn-link" href="#" class="btn-primary-auth" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 14px; width: auto; padding: 10px 24px; height: auto;">
                <i class="fa-solid fa-key"></i> Reset Password Now
            </a>
        </div>

        <form id="forgot-form">
            <div style="margin-bottom: 20px; text-align: left;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--dark-navy);">Email Address</label>
                <div style="position: relative;">
                    <i class="fa-regular fa-envelope" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--secondary-text); font-size: 16px;"></i>
                    <input type="email" id="email" required placeholder="you@example.com" style="width: 100%; padding: 12px 16px 12px 48px; border: 1.5px solid var(--border-color); border-radius: 8px; font-size: 14px; box-sizing: border-box;">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="btn-primary-auth" style="width: 100%; height: 50px;">
                <i class="fa-solid fa-paper-plane" style="margin-right: 6px;"></i> Send Reset Link
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13px;">
            <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;"><i class="fa-solid fa-arrow-left"></i> Back to Log In</a>
        </div>
    </div>
</div>

<script>
    document.getElementById("forgot-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const errorAlert = document.getElementById("error-alert");
        const successAlert = document.getElementById("success-alert");
        const resetContainer = document.getElementById("reset-action-container");
        const submitBtn = document.getElementById("submit-btn");

        errorAlert.style.display = 'none';
        successAlert.style.display = 'none';
        resetContainer.style.display = 'none';
        submitBtn.disabled = true;

        fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        })
        .then(res => res.json())
        .then(data => {
            submitBtn.disabled = false;
            if (data.status === 'success') {
                document.getElementById("success-message").textContent = data.message;
                successAlert.style.display = 'block';
                
                // Show dynamic reset link mapping for vercel demo mapping
                const mockToken = Array.from({length: 64}, () => Math.floor(Math.random()*16).toString(16)).join('');
                document.getElementById("reset-btn-link").href = `/reset-password.html?token=${mockToken}`;
                resetContainer.style.display = 'block';
            } else {
                document.getElementById("error-message").textContent = data.message || "Email not found.";
                errorAlert.style.display = 'block';
            }
        })
        .catch(err => {
            submitBtn.disabled = false;
            document.getElementById("error-message").textContent = "An error occurred. Please try again.";
            errorAlert.style.display = 'block';
        });
    });
</script>

</body>
</html>
